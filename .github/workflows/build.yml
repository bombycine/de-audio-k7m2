name: build-podcast

on:
  push:
    branches: [main]
    paths: ["episodes/**", "build.py", "write_key.py", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-podcast
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: pip install -r requirements.txt
      - name: Synthesize new episodes and rebuild feed
        env:
          GCP_TTS_KEY: ${{ secrets.GCP_TTS_KEY }}
        run: |
          python write_key.py "$RUNNER_TEMP/gcp.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/gcp.json" python build.py
          rm -f "$RUNNER_TEMP/gcp.json"
      - name: Commit audio and feed
        run: |
          git config user.name "podcast-bot"
          git config user.email "podcast-bot@users.noreply.github.com"
          git add docs usage.json
          git diff --cached --quiet || git commit -m "build: $(date -u +%F)"
          git push
